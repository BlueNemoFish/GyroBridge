name: Beta report
description: Tell us how GyroBridge works on your device (working or not - both help!)
title: "[Beta] <device> - <game or emulator> - <works / problem>"
labels: ["beta-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Please press **Save support report** in GyroBridge (with the bridge stopped)
        and attach the file at the bottom. It contains your controller IDs, sensor status and app
        settings - no personal files or account information.
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Legion Go (original, Z1 Extreme)
        - Legion Go (original, Z1)
        - Legion Go S
        - Legion Go 2
        - Other
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Did it work?
      options:
        - Yes, everything worked
        - Partly
        - No
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode ("Game sees")
      multiple: true
      options:
        - Xbox (gyro on right stick)
        - PlayStation (native motion)
        - Two players (split controllers, emulators)
        - Emulator motion server
  - type: input
    id: game
    attributes:
      label: Game / emulator
      placeholder: e.g. Call of Duty MW4, Dolphin - Wii Sports, Ryujinx - Switch Sports
  - type: dropdown
    id: controllers
    attributes:
      label: Controllers
      options:
        - Attached
        - Detached
        - Both / switched while playing
  - type: input
    id: versions
    attributes:
      label: Windows version and Legion Space version (if you know them)
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw. Error messages help a lot.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Support report
      description: Drag the GyroBridge-support-report-....txt file here.
    validations:
      required: true
